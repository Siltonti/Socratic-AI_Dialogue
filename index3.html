<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<title>Sokratisches Gespräch</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

input{
    padding:10px;
    margin:10px 0;
    width:100%;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    background:#457b9d;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d3557;
}

#startbereich{
    margin-top:20px;
}

#dialog{
    margin-top:30px;
    padding:15px;
    background:#eef4ff;
    border-radius:8px;
}

</style>
</head>

<body>

<div class="container">

<h1>KI-Sokratisches Gespräch</h1>

<h3>Start</h3>

<label>Dein Name:</label>
<input type="text" id="name">

<label>Dein Thema:</label>
<input type="text" id="thema">

<button onclick="startGespräch()">Gespräch starten</button>

<div id="startbereich"></div>

<div id="dialog"></div>

</div>


<script>

function startGespräch(){

let name = document.getElementById("name").value;
let thema = document.getElementById("thema").value;

document.getElementById("startbereich").innerHTML =
"Hallo <b>" + name + "</b>. Dein Thema lautet: <b>" + thema + "</b>.";

document.getElementById("dialog").innerHTML =
"Erste Frage:<br><br>Warum interessiert dich dieses Thema?";
}

</script>

</body>

</html>
